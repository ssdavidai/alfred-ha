name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run pytest
        run: pytest -v

  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifest.json + hacs.json + strings.json
        run: |
          python -m json.tool custom_components/alfred/manifest.json > /dev/null
          python -m json.tool custom_components/alfred/strings.json > /dev/null
          python -m json.tool custom_components/alfred/translations/en.json > /dev/null
          python -m json.tool hacs.json > /dev/null

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest (HA manifest sanity)
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # 'brands' is skipped until we register brand assets in
          # home-assistant/brands (separate upstream PR; see issue #112 PR 5).
          ignore: brands
